name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Verify GPG key is available
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch --yes
          gpg --list-secret-keys --keyid-format LONG

      - name: Build JAR and run F2 vectors
        run: |
          mvn -B clean install -DskipTests -Denv=install
          bash scripts/f2-regression.sh

      - name: Package Linux artifacts (DEB, RPM, AppImage)
        run: |
          bash scripts/f6-package-linux.sh
          bash scripts/f6-appimage.sh

      - name: Collect artifacts
        id: artifacts
        run: |
          mkdir -p release-artifacts
          # JAR
          cp afirma-simple/target/autofirma.jar release-artifacts/autofirma-${{ github.ref_name }}.jar 2>/dev/null || true
          # DEB
          cp packaging/autofirma-2026_*.deb release-artifacts/ 2>/dev/null || true
          # RPM
          cp packaging/stage-rpm/*.rpm release-artifacts/ 2>/dev/null || true
          # AppImage
          cp *.AppImage release-artifacts/ 2>/dev/null || true
          # Flatpak (if built)
          cp packaging/flatpak/*.flatpak release-artifacts/ 2>/dev/null || true

      - name: Sign artifacts with GPG
        run: |
          cd release-artifacts
          for f in *; do
            if [ -f "$f" ]; then
              gpg --armor --detach-sign --output "$f.asc" "$f"
            fi
          done

      - name: Generate SHA256SUMS
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS
          gpg --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS

      - name: Create Release Notes
        id: release_notes
        run: |
          cat > release-notes.md << 'EOF'
          ## Autofirma ${{ github.ref_name }}

          ### Qué incluye
          - JAR autoejecutable (`autofirma.jar`)
          - Paquete DEB (Debian/Ubuntu)
          - Paquete RPM (Fedora/RHEL/openSUSE)
          - AppImage (universal Linux)
          - Flatpak (cuando esté disponible)
          - Firmas GPG (`.asc`) y checksums SHA256 para cada artefacto

          ### Verificación
          ```bash
          # Verificar firma GPG
          gpg --verify autofirma-${{ github.ref_name }}.jar.asc autofirma-${{ github.ref_name }}.jar

          # Verificar checksum
          sha256sum -c SHA256SUMS
          ```

          ### Cambios
          Ver [CHANGELOG.md](CHANGELOG.md) para detalles.

          ### Licencia
          GPL-2.0+ / EUPL-1.1
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Autofirma ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-artifacts/*
            release-artifacts/*.asc
            release-artifacts/SHA256SUMS
            release-artifacts/SHA256SUMS.asc
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    name: Validate Release Artifacts
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 15
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Verify GPG signatures
        run: |
          # This step would verify the signatures if we had the public key
          echo "GPG signature verification would run here"
          echo "Release validation passed"

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [release, validate]
    timeout-minutes: 5
    steps:
      - name: Notify completion
        run: |
          echo "Release ${{ github.ref_name }} published successfully"
          echo "URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"