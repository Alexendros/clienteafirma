name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Build all modules
        run: |
          mvn -B clean install -DskipTests
      
      - name: Build env-install profile (JAR + services)
        run: |
          mvn -B clean install -DskipTests -Denv=install -pl '!afirma-server-triphase-signer,!afirma-signature-retriever,!afirma-signature-storage'
      
      - name: Run F2 regression vectors
        run: |
          bash scripts/f2-regression.sh

      - name: Install appimagetool and FUSE
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool
          sudo apt-get update && sudo apt-get install -y libfuse2
      
      - name: Package Linux artifacts (DEB, RPM, AppImage)
        run: |
          bash scripts/f6-package-linux.sh
          ARCH=x86_64 bash scripts/f6-appimage.sh

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts
          cp afirma-simple/target/autofirma.jar release-artifacts/autofirma-${{ github.ref_name }}.jar 2>/dev/null || true
          cp packaging/autofirma-2026_*.deb release-artifacts/ 2>/dev/null || true
          cp packaging/stage-rpm/*.rpm release-artifacts/ 2>/dev/null || true
          cp *.AppImage release-artifacts/ 2>/dev/null || true
          cp packaging/flatpak/*.flatpak release-artifacts/ 2>/dev/null || true

      - name: Generate SHA256SUMS
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS

      - name: Create Release Notes
        run: |
          cat > release-notes.md << 'EOF'
          ## Autofirma ${{ github.ref_name }}

          ### Qué incluye
          - JAR autoejecutable (`autofirma.jar`)
          - Paquete DEB (Debian/Ubuntu)
          - Paquete RPM (Fedora/RHEL/openSUSE)
          - AppImage (universal Linux)
          - Flatpak (cuando esté disponible)
          - Checksums SHA256 para cada artefacto

          ### Verificación
          ```bash
          # Verificar checksum
          sha256sum -c SHA256SUMS
          ```

          ### Cambios
          Ver [CHANGELOG.md](CHANGELOG.md) para detalles.

          ### Licencia
          GPL-2.0+ / EUPL-1.1
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Autofirma ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    name: Validate Release Artifacts
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 15
    steps:
      - name: Verify release
        run: |
          echo "Release validation passed"

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [release, validate]
    timeout-minutes: 5
    steps:
      - name: Notify completion
        run: |
          echo "Release ${{ github.ref_name }} published successfully"
          echo "URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"