name: Validate Portal

on:
  push:
    branches: [master, main]
    paths:
      - 'docs/portal/**'
  pull_request:
    branches: [master, main]
    paths:
      - 'docs/portal/**'

jobs:
  validate:
    name: Validate Portal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/portal/package-lock.json

      - name: Install html-validate
        run: npm install -g html-validate@latest

      - name: Run portal validation
        run: node docs/portal/validate-portal.mjs --ci
        working-directory: .

      - name: Upload validation artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portal-validation-logs
          path: |
            docs/portal/
          retention-days: 7

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload portal artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/portal

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4