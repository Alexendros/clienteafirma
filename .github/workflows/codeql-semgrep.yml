name: CodeQL + Semgrep

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [java]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build with Maven
        run: mvn -B clean compile -DskipTests -Denv=install

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true

      - name: Upload CodeQL SARIF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: |
            **/codeql-*.sarif
            **/*codeql*.sarif
          if-no-files-found: ignore
          retention-days: 7

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: pip3 install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan --config=auto --config=p/ci \
            --sarif --output=semgrep.sarif \
            --error --max-target-bytes=1000000 || true

      - name: Upload Semgrep SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Semgrep SARIF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 7

  sarif-merge:
    name: Merge SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [codeql, semgrep]
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Download CodeQL SARIF
        uses: actions/download-artifact@v4
        with:
          name: codeql-results
          path: sarif/codeql

      - name: Download Semgrep SARIF
        uses: actions/download-artifact@v4
        with:
          name: semgrep-results
          path: sarif/semgrep

      - name: Merge SARIF files
        run: |
          mkdir -p sarif/merged
          # CodeQL uploads multiple SARIF files, Semgrep uploads one
          # The upload-sarif action can accept a directory and will merge them
          cp -r sarif/codeql/* sarif/merged/ 2>/dev/null || true
          cp -r sarif/semgrep/* sarif/merged/ 2>/dev/null || true
          ls -la sarif/merged/

      - name: Upload merged SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif/merged
          category: merged
