name: CodeQL + Semgrep

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [java]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Initialize CodeQL
        uses: github/codeql-action/init@75d92147bd8ad1d8e9ea662d0c4b3d2e4c9d8d7e # v3.25.2
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Set up JDK 8
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build with Maven
        run: mvn -B clean compile -DskipTests -Denv=install

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@75d92147bd8ad1d8e9ea662d0c4b3d2e4c9d8d7e # v3.25.2
        with:
          category: "/language:${{ matrix.language }}"

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4044e123b7aa3
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: pip3 install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan --config=auto --config=p/ci \
            --sarif --output=semgrep.sarif \
            --error --max-target-bytes=1000000 || true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@75d92147bd8ad1d8e9ea662d0c4b3d2e4c9d8d7e
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sarif-merge:
    name: Merge SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [codeql, semgrep]
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Download CodeQL SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: codeql-results
          path: sarif/

      - name: Download Semgrep SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: semgrep-results
          path: sarif/

      - name: Upload merged SARIF
        uses: github/codeql-action/upload-sarif@75d92147bd8ad1d8e9ea662d0c4b3d2e4c9d8d7e
        with:
          sarif_file: sarif/
          category: merged
