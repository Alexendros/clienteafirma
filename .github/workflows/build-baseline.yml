name: build-baseline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-jdk8:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: pom.xml

      # Full reactor first (BC modules), then product profile for JAR/WARs.
      - name: Build (full install + env=install)
        run: |
          mvn -B clean install -Dmaven.test.skip=true
          mvn -B install -Dmaven.test.skip=true -Denv=install

      - name: Upload autofirma.jar
        uses: actions/upload-artifact@v4
        with:
          name: autofirma-jar
          path: afirma-simple/target/autofirma.jar
          if-no-files-found: error

      - name: Upload installed es.gob.afirma Maven artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m2-afirma
          path: ~/.m2/repository/es/gob/afirma
          if-no-files-found: error

  f2-vectors:
    needs: build-linux-jdk8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: |
            pom.xml
            tests/validation-harness/pom.xml

      - name: Restore es.gob.afirma artifacts
        uses: actions/download-artifact@v4
        with:
          name: m2-afirma
          path: ~/.m2/repository/es/gob/afirma

      - name: Download autofirma.jar
        uses: actions/download-artifact@v4
        with:
          name: autofirma-jar
          path: afirma-simple/target

      - name: F2 regression gate
        run: bash scripts/f2-regression.sh

      - name: F2 validation harness (integrity + negatives)
        working-directory: tests/validation-harness
        env:
          VECTORS_DIR: ${{ github.workspace }}/vectors
        run: mvn -B test -Dvectors.dir="${VECTORS_DIR}"
